# ── 日语罗马音键盘布局 Pro 版（Xime / xime.custom.yaml）──
#
# 标准 QWERTY 26 个字母键 + 1 个长音键（-）+ 顶部 0-9 数字行。
# 键面不放假名助记，保持罗马音键盘本来的样子。
#
# 手势约定（只用「点按 + 长按」，不使用上下滑）：
#   字母键   点按 = 罗马音（进 Rime 组合）
#            长按 = 一个常用符号，或一个编辑功能
#   数字键   点按 = 数字，长按 = 弹出「上标 / 下标」二选一
#   长音键 - 点按 = 进 Rime（由方案决定转成 ー 还是别的），长按 = 下划线
#   大小写   交给 Shift，不占字母键长按
#
# 全角 / 半角：
#   qwerty 段（中文态）写全角字形，qwerty_en 段（英文态）写半角字形。
#   「全/半」键走 toggle_ascii 切换中英态，符号随之自动换成对应字形，
#   无需在单个按键上做条件判断。
#
# 导入方式：Xime → 输入方案 → 已导入 → 右上角 + → 浏览器导入 → 上传本文件 → 部署。
# 本文件只写「与内置默认不同的部分」，删除任意一段即可回退到内置行为。
metadata:
  app_name: Xime
  app_version: ">=3.0.0"
  platform: android
  config_version: 1
  generator: "Xime Config Generator" # 暂时无用
  modified_time: "2026-10-21"

keyboard:
  # ══════════════════════════════════════════════════════════
  # 中文键盘段（qwerty）—— 全角字形
  #
  # Xime 按方案加载键盘段：未声明 schemas 绑定的方案一律使用 qwerty，
  # 罗马音布局写在这里即可生效；切到英文后走 qwerty_en，下面同样配了一份。
  # ══════════════════════════════════════════════════════════
  qwerty:
    # standard：主文字居中，下滑提示在按键底部（默认值）
    button_layout: standard
    layout:
      # ── 键位：5 行。
      #    第 1 行 0-9 数字行；
      #    第 2-4 行 26 个字母键保持标准 QWERTY 位置，l 右侧追加长音键 "-"；
      #    第 5 行功能键：123 · 符 | ，(！) 空格(语音) 。(？) 全/半(方案) enter
      rows:
        - ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l, "-"]
        - [shift, z, x, c, v, b, n, m, delete]
        - [mode_change, fu, comma, space, period, half_full, enter]
    keys:
      # ── 第 1 行 数字行：点按数字，长按「上标 / 下标」二选一 ──
      "1": { tap: "1", long_press: { display: "bubble", values: ["¹", "₁"] } }
      "2": { tap: "2", long_press: { display: "bubble", values: ["²", "₂"] } }
      "3": { tap: "3", long_press: { display: "bubble", values: ["³", "₃"] } }
      "4": { tap: "4", long_press: { display: "bubble", values: ["⁴", "₄"] } }
      "5": { tap: "5", long_press: { display: "bubble", values: ["⁵", "₅"] } }
      "6": { tap: "6", long_press: { display: "bubble", values: ["⁶", "₆"] } }
      "7": { tap: "7", long_press: { display: "bubble", values: ["⁷", "₇"] } }
      "8": { tap: "8", long_press: { display: "bubble", values: ["⁸", "₈"] } }
      "9": { tap: "9", long_press: { display: "bubble", values: ["⁹", "₉"] } }
      "0": { tap: "0", long_press: { display: "bubble", values: ["⁰", "₀"] } }

      # ── 第 2 行：点按罗马音，长按符号 / 功能 ──
      q: { tap: "q", long_press: { label: "Tab", action: "tab", bubble: false } }
      w: { tap: "w", long_press: { label: "～", action: "commit", value: "～", bubble: false } }
      e: { tap: "e", long_press: { label: "・", action: "commit", value: "・", bubble: false } }
      r: { tap: "r", long_press: { display: "bubble", values: ["￥", "＄"] } }
      t: { tap: "t", long_press: { label: "％", action: "commit", value: "％", bubble: false } }
      y: { tap: "y", long_press: { label: "恢复", action: "undo", bubble: false } }
      u: { tap: "u", long_press: { label: "＆", action: "commit", value: "＆", bubble: false } }
      i: { tap: "i", long_press: { label: "＊", action: "commit", value: "＊", bubble: false } }
      o: { tap: "o", long_press: { label: "（", action: "commit", value: "（", bubble: false } }
      p: { tap: "p", long_press: { label: "）", action: "commit", value: "）", bubble: false } }

      # ── 第 3 行：点按罗马音，长按符号 / 功能 ──
      a: { tap: "a", long_press: { label: "全选", action: "select_all", bubble: false } }
      s: { tap: "s", long_press: { label: "＠", action: "commit", value: "＠", bubble: false } }
      d: { tap: "d", long_press: { label: "：", action: "commit", value: "：", bubble: false } }
      f: { tap: "f", long_press: { label: "；", action: "commit", value: "；", bubble: false } }
      g: { tap: "g", long_press: { label: "【", action: "commit", value: "【", bubble: false } }
      h: { tap: "h", long_press: { label: "】", action: "commit", value: "】", bubble: false } }
      j: { tap: "j", long_press: { label: "＋", action: "commit", value: "＋", bubble: false } }
      k: { tap: "k", long_press: { label: "＝", action: "commit", value: "＝", bubble: false } }
      l: { tap: "l", long_press: { label: "＃", action: "commit", value: "＃", bubble: false } }
      # 长音键：tap 走 send_rime 进 Rime，由方案自己的规则决定 "-" 变成什么
      # （长音符 ー 或别的）；长按直接输出下划线。
      "-": { tap: { label: "-", action: "send_rime", value: "-" }, long_press: { label: "＿", action: "commit", value: "＿", bubble: false } }

      # ── 第 4 行：点按罗马音，长按符号 / 功能 ──
      z: { tap: "z", long_press: { label: "撤销", action: "undo", bubble: false } }
      x: { tap: "x", long_press: { label: "剪切", action: "cut", bubble: false } }
      c: { tap: "c", long_press: { label: "复制", action: "copy", bubble: false } }
      v: { tap: "v", long_press: { label: "粘贴", action: "paste", bubble: false } }
      b: { tap: "b", long_press: { label: "／", action: "commit", value: "／", bubble: false } }
      n: { tap: "n", long_press: { label: "＼", action: "commit", value: "＼", bubble: false } }
      m: { tap: "m", long_press: { label: "……", action: "commit", value: "……", bubble: false } }

      # ── 第 5 行 功能键 ──
      # 123：点按直接进数字面板，长按「数字 / 常用符号」二选一。
      mode_change: {
        width: 1.2,
        tap: { label: "123", action: "command", value: "mode_change_number", bubble: false },
        long_press: { display: "bubble", values: [
          { label: "number", action: "command", value: "mode_change_number" },
          { label: "common_symbol", action: "command", value: "mode_change_common_symbol" }
        ] }
      }
      # 符：点赶往常用符号面板。
      # 注意不能用内置 id「symbol」——它是功能键，渲染层强制画键盘图标，
      # 会忽略 label；改用自定义 id 才能让键面显示「符」二字。
      fu: { width: 1, tap: { label: "符", action: "command", value: "symbol", bubble: false } }
      # 逗号（ASCII 半角逗号，非顿号）：点按「，」，长按「！」。
      comma: {
        width: 0.8,
        tap: { label: "，", value: "，", action: "commit" },
        long_press: { label: "！", action: "commit", value: "！", bubble: false }
      }
      # 空格：点按空格，长按语音输入；宽度从内置 3 缩到 2.5 让出两侧标点键。
      space: { width: 2.5, tap: { action: "space", bubble: false }, long_press: { label: "语音", action: "voice", bubble: false } }
      # 句号：点按「。」，长按「？」。
      period: {
        width: 0.8,
        tap: { label: "。", value: "。", action: "commit" },
        long_press: { label: "？", action: "commit", value: "？", bubble: false }
      }
      # 全/半：中文态键面显示「全」，点按切到英文态；长按选择输入方案。
      half_full: {
        width: 0.8,
        tap: { label: "全", action: "toggle_ascii", bubble: false },
        long_press: { label: "方案", action: "command", value: "show_ime_picker", bubble: false }
      }

  # ══════════════════════════════════════════════════════════
  # 英文键盘段（qwerty_en）—— 半角字形
  # 与 qwerty 同一套键位与手势，仅符号换成半角形式。
  # ══════════════════════════════════════════════════════════
  qwerty_en:
    button_layout: standard
    layout:
      rows:
        - ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l, "-"]
        - [shift, z, x, c, v, b, n, m, delete]
        - [mode_change, fu, comma, space, period, half_full, enter]
    keys:
      # ── 第 1 行 数字行：点按数字，长按「上标 / 下标」二选一 ──
      "1": { tap: "1", long_press: { display: "bubble", values: ["¹", "₁"] } }
      "2": { tap: "2", long_press: { display: "bubble", values: ["²", "₂"] } }
      "3": { tap: "3", long_press: { display: "bubble", values: ["³", "₃"] } }
      "4": { tap: "4", long_press: { display: "bubble", values: ["⁴", "₄"] } }
      "5": { tap: "5", long_press: { display: "bubble", values: ["⁵", "₅"] } }
      "6": { tap: "6", long_press: { display: "bubble", values: ["⁶", "₆"] } }
      "7": { tap: "7", long_press: { display: "bubble", values: ["⁷", "₇"] } }
      "8": { tap: "8", long_press: { display: "bubble", values: ["⁸", "₈"] } }
      "9": { tap: "9", long_press: { display: "bubble", values: ["⁹", "₉"] } }
      "0": { tap: "0", long_press: { display: "bubble", values: ["⁰", "₀"] } }

      # ── 第 2 行：点按罗马音，长按符号 / 功能 ──
      q: { tap: "q", long_press: { label: "Tab", action: "tab", bubble: false } }
      w: { tap: "w", long_press: { label: "~", action: "commit", value: "~", bubble: false } }
      e: { tap: "e", long_press: { label: "・", action: "commit", value: "・", bubble: false } }
      r: { tap: "r", long_press: { display: "bubble", values: ["¥", "$"] } }
      t: { tap: "t", long_press: { label: "%", action: "commit", value: "%", bubble: false } }
      y: { tap: "y", long_press: { label: "恢复", action: "undo", bubble: false } }
      u: { tap: "u", long_press: { label: "&", action: "commit", value: "&", bubble: false } }
      i: { tap: "i", long_press: { label: "*", action: "commit", value: "*", bubble: false } }
      o: { tap: "o", long_press: { label: "(", action: "commit", value: "(", bubble: false } }
      p: { tap: "p", long_press: { label: ")", action: "commit", value: ")", bubble: false } }

      # ── 第 3 行：点按罗马音，长按符号 / 功能 ──
      a: { tap: "a", long_press: { label: "全选", action: "select_all", bubble: false } }
      s: { tap: "s", long_press: { label: "@", action: "commit", value: "@", bubble: false } }
      d: { tap: "d", long_press: { label: ":", action: "commit", value: ":", bubble: false } }
      f: { tap: "f", long_press: { label: ";", action: "commit", value: ";", bubble: false } }
      g: { tap: "g", long_press: { label: "[", action: "commit", value: "[", bubble: false } }
      h: { tap: "h", long_press: { label: "]", action: "commit", value: "]", bubble: false } }
      j: { tap: "j", long_press: { label: "+", action: "commit", value: "+", bubble: false } }
      k: { tap: "k", long_press: { label: "=", action: "commit", value: "=", bubble: false } }
      l: { tap: "l", long_press: { label: "#", action: "commit", value: "#", bubble: false } }
      "-": { tap: { label: "-", action: "send_rime", value: "-" }, long_press: { label: "_", action: "commit", value: "_", bubble: false } }

      # ── 第 4 行：点按罗马音，长按符号 / 功能 ──
      z: { tap: "z", long_press: { label: "撤销", action: "undo", bubble: false } }
      x: { tap: "x", long_press: { label: "剪切", action: "cut", bubble: false } }
      c: { tap: "c", long_press: { label: "复制", action: "copy", bubble: false } }
      v: { tap: "v", long_press: { label: "粘贴", action: "paste", bubble: false } }
      b: { tap: "b", long_press: { label: "/", action: "commit", value: "/", bubble: false } }
      n: { tap: "n", long_press: { label: "\\", action: "commit", value: "\\", bubble: false } }
      m: { tap: "m", long_press: { label: "...", action: "commit", value: "...", bubble: false } }

      # ── 第 5 行 功能键 ──
      mode_change: {
        width: 1.2,
        tap: { label: "123", action: "command", value: "mode_change_number", bubble: false },
        long_press: { display: "bubble", values: [
          { label: "number", action: "command", value: "mode_change_number" },
          { label: "common_symbol", action: "command", value: "mode_change_common_symbol" }
        ] }
      }
      # 同 qwerty 段：不能用内置 id「symbol」，否则键面被强制渲染成键盘图标。
      fu: { width: 1, tap: { label: "符", action: "command", value: "symbol", bubble: false } }
      comma: {
        width: 0.8,
        tap: { label: ",", value: ",", action: "commit" },
        long_press: { label: "!", action: "commit", value: "!", bubble: false }
      }
      space: { width: 2.5, tap: { action: "space", bubble: false }, long_press: { label: "语音", action: "voice", bubble: false } }
      period: {
        width: 0.8,
        tap: { label: ".", value: ".", action: "commit" },
        long_press: { label: "?", action: "commit", value: "?", bubble: false }
      }
      # 全/半：英文态键面显示「半」，点按切回中文态；长按选择输入方案。
      half_full: {
        width: 0.8,
        tap: { label: "半", action: "toggle_ascii", bubble: false },
        long_press: { label: "方案", action: "command", value: "show_ime_picker", bubble: false }
      }
